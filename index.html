<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <button class="logo" id="logoBtn">✦ My Tracker</button>
    <nav class="nav">
      <button class="nav-btn" data-view="inbox">📥 Inbox</button>
      <button class="nav-btn active" data-view="horizons">🎯 Horizons</button>
      <button class="nav-btn" data-view="days">📅 Days</button>
      <button class="nav-btn" data-view="weeks">🗓 Weeks</button>
      <button class="nav-btn" data-view="years">📆 Years</button>
      <button class="nav-btn" data-view="calendar">🗒 Calendar</button>
    </nav>
    <div class="projects-section">
      <div class="projects-header">
        <span>Projects</span>
        <button class="add-proj-btn" id="addProjectBtn" title="Новый проект">+</button>
      </div>
      <div class="projects-list" id="projectsList"></div>
    </div>
    <div class="sidebar-footer">
      <button class="settings-btn" id="settingsBtn">⚙ Настройки</button>
    </div>
  </aside>

  <main class="main" id="main"></main>
</div>

<!-- Task modal -->
<div class="modal-backdrop" id="taskModal" hidden>
  <div class="modal modal-task">
    <div class="modal-scroll">
      <div class="modal-header">
        <div class="task-header-left">
          <button class="back-to-parent" id="backToParentBtn" hidden></button>
          <div class="task-tags">
            <button class="tag tag-project" id="projectTag">Без проекта <span class="chev">▾</span></button>
            <button class="tag tag-status" id="statusTag">📝 To Do <span class="chev">▾</span></button>
          </div>
        </div>
        <div class="header-actions">
          <button class="fire-btn" id="importantBtn" title="Отметить важной">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M13.5 2c-.3 1.7-1 3.3-2 4.7-1 1.5-2.2 2.8-3.5 4.1-1 .9-1.9 1.8-2.6 2.8-.7 1-1.1 2.2-1.1 3.4 0 2 .8 3.8 2.2 5.2C7.9 23.4 9.8 24 12 24c2.2 0 4.1-.6 5.5-2 1.4-1.4 2.2-3.2 2.2-5.2 0-1.3-.2-2.6-.7-3.9-.5-1.3-1.1-2.5-1.9-3.6-.9-1.2-1.8-2.4-2.5-3.6-.6-1.2-1-2.5-1.1-3.8zm-.1 12.6c.7.7 1.4 1.5 1.9 2.4.5.9.8 1.9.8 3 0 1.3-.5 2.5-1.4 3.4-.9.9-2.1 1.4-3.4 1.4s-2.5-.5-3.4-1.4c-.9-.9-1.4-2.1-1.4-3.4 0-.9.2-1.7.7-2.4.5-.7 1.1-1.4 1.8-2 .6-.5 1.1-1.1 1.6-1.8.4-.7.7-1.4.8-2.2.3.7.6 1.3 1 1.9.4.4.7.7 1 1.1z"/></svg>
          </button>
          <button class="modal-close" data-close>✕</button>
        </div>
      </div>
      <input type="text" id="taskTitle" class="task-title-input" placeholder="Название задачи" />

      <div class="modal-row">
        <label class="modal-label">Когда</label>
        <button class="tag tag-date" id="dateTag">Без даты <span class="chev">▾</span></button>
      </div>

      <div class="modal-row">
        <label class="modal-label">Повтор</label>
        <select id="taskRepeat">
          <option value="none">Не повторять</option>
          <option value="daily">Ежедневно</option>
          <option value="weekdays">По будням (пн–пт)</option>
          <option value="weekly">Еженедельно (тот же день)</option>
          <option value="custom-weekdays">Еженедельно (выбрать дни)</option>
          <option value="monthly">Ежемесячно</option>
          <option value="yearly">Ежегодно</option>
        </select>
      </div>
      <div class="modal-row" id="weekdaysRow" hidden>
        <label class="modal-label">Дни</label>
        <div class="weekdays-picker" id="weekdaysPicker">
          <label><input type="checkbox" value="1"/> Пн</label>
          <label><input type="checkbox" value="2"/> Вт</label>
          <label><input type="checkbox" value="3"/> Ср</label>
          <label><input type="checkbox" value="4"/> Чт</label>
          <label><input type="checkbox" value="5"/> Пт</label>
          <label><input type="checkbox" value="6"/> Сб</label>
          <label><input type="checkbox" value="0"/> Вс</label>
        </div>
      </div>

      <div class="modal-row">
        <label class="modal-label">Файлы</label>
        <input type="file" id="taskFiles" multiple accept="image/*,.pdf,.doc,.docx,.xls,.xlsx" />
      </div>
      <div class="attachments" id="attachmentsList"></div>

      <div class="subtasks-section">
        <div class="subtasks-header">Подзадачи</div>
        <div class="subtasks-list" id="subtasksList"></div>
        <div class="subtask-add">
          <input type="text" id="subtaskInput" placeholder="+ Добавить подзадачу (Enter)" />
        </div>
        <div class="subtasks-hint" id="subtasksHint" hidden>Клик на подзадачу открывает её отдельно со всеми полями</div>
      </div>

      <div class="modal-row modal-row-vertical">
        <label class="modal-label">Описание</label>
        <textarea id="taskDesc" class="task-desc-input" placeholder="Заметки, детали, ссылки…"></textarea>
      </div>

      <div class="modal-actions">
        <button class="btn btn-danger" id="deleteTaskBtn" hidden>Удалить</button>
        <div class="spacer"></div>
        <button class="btn btn-ghost" data-close>Отмена</button>
        <button class="btn btn-primary" id="saveTaskBtn">Сохранить</button>
      </div>
    </div>
  </div>
</div>

<!-- Project modal -->
<div class="modal-backdrop" id="projectModal" hidden>
  <div class="modal modal-sm">
    <div class="modal-scroll">
      <div class="modal-header">
        <div class="modal-project">Проект</div>
        <button class="modal-close" data-close-proj>✕</button>
      </div>
      <div class="project-emoji-row">
        <div class="big-emoji" id="bigEmoji">🎯</div>
        <div class="emoji-input-wrap">
          <input type="text" id="emojiInput" maxlength="6" placeholder="Любой эмодзи" />
          <div class="hint">Подсказка: <kbd>⌃</kbd> + <kbd>⌘</kbd> + <kbd>Space</kbd> — открыть macOS-эмодзи</div>
        </div>
      </div>
      <input type="text" id="projectName" class="task-title-input" placeholder="Название проекта" />
      <textarea id="projectDesc" class="task-desc-input" placeholder="Описание проекта (необязательно)"></textarea>
      <div class="modal-row modal-row-vertical">
        <label class="modal-label">Быстрый выбор</label>
        <div class="emoji-picker" id="emojiPicker"></div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-danger" id="deleteProjectBtn" hidden>Удалить</button>
        <div class="spacer"></div>
        <button class="btn btn-ghost" data-close-proj>Отмена</button>
        <button class="btn btn-primary" id="saveProjectBtn">Сохранить</button>
      </div>
    </div>
  </div>
</div>

<!-- Floating tag-dropdown (project/status) -->
<div class="tag-dropdown" id="tagDropdown" hidden></div>

<!-- Date picker popup -->
<div class="date-popup-backdrop" id="datePopupBackdrop" hidden>
  <div class="date-popup" id="datePopup">
    <div class="dp-tabs" id="dpTabs">
      <button data-dt="day">День</button>
      <button data-dt="week">Неделя</button>
      <button data-dt="month">Месяц</button>
      <button data-dt="year">Год</button>
      <button data-dt="life">Жизнь</button>
    </div>
    <div class="dp-body" id="dpBody"></div>
    <div class="dp-actions">
      <button class="btn btn-ghost" id="dpRemoveBtn">Удалить дату</button>
      <div class="spacer"></div>
      <button class="btn btn-primary" id="dpOkBtn">OK</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
